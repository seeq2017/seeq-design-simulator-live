<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SeeQ デザインシミュレーター（移転しました）</title>
<script>
/* 旧URL（github.io）→ 新URL への転送ページ。?code=SQ-XXXXX など検索文字列はそのまま引き継ぐ。
   新URLは1か所だけ書き換えれば済むように定数化。 */
var NEW_URL = 'https://www.seeq-kyoto.com/simulator/';
try{
  var qs = location.search || '';
  location.replace(NEW_URL + qs + (location.hash || ''));
}catch(e){}
</script>
<style>
  body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:#F7F7F8;color:#111;display:grid;place-items:center;min-height:100vh}
  .box{background:#fff;border:1px solid #E6E6E9;border-radius:12px;padding:28px 24px;max-width:420px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  a.btn{display:inline-block;margin-top:14px;background:#e2231a;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
  p{font-size:14px;line-height:1.7;color:#6B6B72}
</style>
</head>
<body>
  <div class="box">
    <h1 style="font-size:18px;margin:0 0 8px">デザインシミュレーターは移転しました</h1>
    <p>自動で新しいページへ移動します。移動しない場合は下のボタンを押してください。<br>保存コードはそのまま使えます。</p>
    <a class="btn" id="go" href="https://www.seeq-kyoto.com/simulator/">新しいシミュレーターを開く</a>
  </div>
  <script>try{ document.getElementById('go').href = NEW_URL + (location.search||''); }catch(e){}</script>
</body>
</html>
